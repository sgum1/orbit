<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<meta name="description" content="Keep up with your people.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --ink:#1a1a1a; --ink-2:#45454b; --muted:#7c7c82; --faint:#b4b4b9;
  --line:#e7e7e3; --hover:#f2f2ef;
  --accent:#1a1a1a; --accent-ink:#ffffff;
  --acq:#557767; --acq-soft:#edf3ef;
  --overdue:#b5543d; --due:#a67a2c; --soon:#6c707b; --good:#5d8869;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212; --surface:#191919; --ink:#ececec; --ink-2:#c6c6ca; --muted:#8e8e94; --faint:#55555a;
    --line:#282828; --hover:#1f1f1f;
    --accent:#ececec; --accent-ink:#121212;
    --acq:#8fb39e; --acq-soft:#1b2520;
    --overdue:#dc8d77; --due:#d2ae67; --soon:#a3a6b0; --good:#90c09b;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{font:15px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:24px;height:64px}
.logo{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.mark{width:15px;height:15px;border:1.5px solid var(--ink);border-radius:50%;position:relative;display:inline-block}
.mark:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acq);top:-3px;right:-3px}
nav{display:flex;gap:22px;margin-left:auto}
nav button{background:none;border:0;padding:6px 0;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
nav .n{font-size:11px;color:var(--overdue);margin-left:5px;font-variant-numeric:tabular-nums}

main{padding:48px 0 120px}

/* type */
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.15;letter-spacing:-.015em;margin:6px 0 8px}
.lede{color:var(--muted);margin:0;max-width:580px}
.muted{color:var(--muted)} .small{font-size:13px}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:52px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.section .eyebrow span{color:var(--faint);margin-left:8px;font-weight:500}
.section-note{font-size:12.5px;color:var(--muted);text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{opacity:.88;border-color:var(--accent)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted);padding:0 8px}
.btn-quiet:hover{color:var(--ink);border-color:transparent;background:var(--hover)}
.btn-danger{color:var(--overdue)}
.btn-sm{height:30px;padding:0 11px;font-size:13px}
.btn-icon{width:34px;padding:0;font-size:16px}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);cursor:pointer;font-size:inherit}
.linkish:hover{text-decoration-color:var(--ink)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:24px}

/* tags & status */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.tag-acq{color:var(--acq);background:var(--acq-soft)}
.tag-acq:before{content:"";width:5px;height:5px;border-radius:50%;border:1.5px solid currentColor}
.tag-grew{color:var(--acq);border:1px dashed var(--acq);padding:1px 8px}
.tag-ld{color:var(--muted);border:1px solid var(--line);padding:1px 8px}
.status{font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.status:before,.dot{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.s-overdue{color:var(--overdue)} .s-due{color:var(--due)} .s-soon{color:var(--soon)} .s-good{color:var(--good)} .s-plan{color:var(--ink)}
.s-plan:before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}

/* week summary */
.week-progress{display:flex;align-items:center;gap:14px;margin-top:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.week-progress .bar{flex:1;max-width:280px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;transition:opacity .2s}
.card.is-done{opacity:.5}
.card.is-done:hover{opacity:.8}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-size:16px;font-weight:600;letter-spacing:-.005em;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.name:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:5px}
.idea{font-size:13.5px;color:var(--ink-2);margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.note b{font-weight:500;color:var(--ink-2)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.card .actions{margin-top:auto;padding-top:18px}

/* rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:6px 1fr 120px 120px;gap:18px;align-items:center;padding:15px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:hover{background:var(--hover)}
.row.simple{grid-template-columns:6px 1fr auto}
.row.plan{grid-template-columns:88px 1fr auto}
.row-main{min-width:0}
.row .name{font-size:15px}
.cell{display:flex;flex-direction:column;font-size:13px;font-variant-numeric:tabular-nums}
.cell-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.right{text-align:right;align-items:flex-end}
.when-col{font-size:13px;font-variant-numeric:tabular-nums}
.when-col b{display:block;font-weight:600}
.when-col span{color:var(--muted)}

/* banner */
.banner{margin-top:32px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 20px}
.banner-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.banner-row:last-child{border-bottom:0}
.banner-row .grow{flex:1;min-width:0}

/* calendar */
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-top:28px}
.day{min-height:340px;padding:12px 9px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.day:first-child{border-left:0}
.day.past{background:color-mix(in srgb,var(--bg) 55%,var(--surface))}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 3px}
.day-name{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day-num{font-family:var(--serif);font-size:20px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .day-num{background:var(--ink);color:var(--bg);font-size:16px}
.ev{display:block;width:100%;text-align:left;background:var(--hover);border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:12.5px;line-height:1.35;overflow:hidden}
.ev:hover{border-color:var(--faint)}
.ev .t{font-size:11px;color:var(--muted);display:block;font-variant-numeric:tabular-nums}
.ev b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.ev .who{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}
.ev.done{background:var(--acq-soft)}
.ev.done .t:after{content:" · done";color:var(--acq)}
.ev.confirm{background:transparent;border:1px dashed var(--faint)}
.ev.confirm .t:after{content:" · confirm";color:var(--due)}
.ev.log{background:transparent;border:1px solid var(--line)}
.day-body{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.day-texts{font-size:11.5px;color:var(--muted);padding:2px 3px;line-height:1.4}
.day-add{margin-top:auto;background:none;border:1px dashed transparent;border-radius:8px;color:var(--faint);font-size:12.5px;padding:6px;cursor:pointer}
.day:hover .day-add{border-color:var(--line);color:var(--muted)}
.day-add:hover{color:var(--ink)!important;border-color:var(--faint)!important}
.cal-sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.cal-sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* controls */
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;transition:border-color .15s}
input,select{height:38px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:78px;resize:vertical}
.search{max-width:260px}
.seg-tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface)}
.seg-tabs button{background:none;border:0;font-size:13px;padding:5px 12px;border-radius:6px;color:var(--muted);cursor:pointer}
.seg-tabs button.on{background:var(--hover);color:var(--ink)}
select.inline{width:auto}
.picker{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto;padding:2px 0}
.pick{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none;transition:all .12s}
.pick:hover{border-color:var(--faint)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.acq{color:var(--acq)}
.pick.acq:has(input:checked){background:var(--acq);border-color:var(--acq);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;margin-top:18px}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--ink)}
.check small{display:block;color:var(--muted);font-size:12.5px}

/* progress */
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--acq);border-radius:3px}
.bar.ink span{background:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:32px}
.stat{padding:20px 16px 20px 0}
.stat + .stat{padding-left:18px;border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 8px 13px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
td input{width:84px}
td .hint{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

/* empty */
.empty{text-align:center;padding:72px 20px}
.empty .lede{margin:0 auto}
.empty .actions{justify-content:center;margin-top:28px}
.orbit{width:70px;height:70px;border:1px solid var(--faint);border-radius:50%;margin:0 auto 28px;position:relative}
.orbit:before{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--ink)}
.orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--acq);top:6px;right:6px}
.quiet-box{border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--muted)}
.quiet-box h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin:0 0 4px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(18,18,18,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:20;overflow:auto;animation:fade .15s ease}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:540px;padding:30px 32px;box-shadow:0 24px 70px rgba(0,0,0,.18);animation:rise .18s ease}
@keyframes fade{from{opacity:0}} @keyframes rise{from{opacity:0;transform:translateY(6px)}}
.modal h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;margin:0}
.modal .sub{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field > label,.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:12px}
.choice{display:flex;gap:8px}
.choice label{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:14px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.choice label:hover{border-color:var(--faint)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--ink)}
.choice label.acq:has(input:checked){border-color:var(--acq);background:var(--acq-soft)}
.choice small{color:var(--muted);font-size:12.5px}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:28px;flex-wrap:wrap}
.foot .left{margin-right:auto}
details summary{font-size:13px;color:var(--muted);cursor:pointer;margin-top:20px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"+ "}
details[open] summary:before{content:"– "}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:22px}
.facts div{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts div:nth-child(odd){padding-right:14px}
.facts div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.facts small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
.panel{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--acq-soft)}
.panel.plain{background:var(--hover)}
.panel-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;gap:10px}
.panel p{font-size:13px;margin:10px 0 0;color:var(--ink-2)}
.history{margin-top:8px}
.log{display:grid;grid-template-columns:70px 1fr 20px;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.log:last-child{border-bottom:0}
.log .when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.log .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:17px;line-height:1;padding:0}
.log .x:hover{color:var(--overdue)}
.log.click{cursor:pointer}
.notes-block{font-size:13.5px;color:var(--ink-2);margin-top:16px;white-space:pre-wrap}
.notes-block .label{display:block;margin-bottom:3px}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;display:flex;gap:16px;align-items:center;z-index:30;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:rise .18s ease;white-space:nowrap;max-width:92vw}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* research */
.entries{border-top:1px solid var(--line);margin-top:36px}
.entry{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:30px 0;border-bottom:1px solid var(--line)}
.entry .num{font-family:var(--serif);color:var(--faint);font-size:18px}
.entry h3{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.01em;margin:0 0 8px}
.entry p{margin:0 0 10px;color:var(--ink-2);max-width:640px}
.entry .use{font-size:13.5px;color:var(--ink);border-left:2px solid var(--acq);padding-left:12px;margin:14px 0 12px}
.entry .cite{font-size:12.5px;color:var(--muted)}

@media (max-width:820px){
  .cal{grid-template-columns:1fr}
  .day{border-left:0;border-top:1px solid var(--line);min-height:0}
  .day:first-child{border-top:0}
  .day-head{justify-content:flex-start;gap:10px}
  .day-add{margin-top:4px;border-color:var(--line);color:var(--muted)}
}
@media (max-width:640px){
  .wrap{padding:0 18px}
  .top{height:52px}
  #nav{display:none}
  main{padding-top:28px;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  h1{font-size:30px}
  .cards{grid-template-columns:1fr}
  .row{grid-template-columns:6px 1fr;row-gap:6px}
  .row .cell{grid-column:2;flex-direction:row;gap:8px}
  .row.plan{grid-template-columns:70px 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat + .stat{border-left:0;padding-left:0}
  .two,.three{grid-template-columns:1fr}
  .backdrop{align-items:flex-end;padding:0;padding-top:max(24px, env(safe-area-inset-top))}
  .modal{max-width:none;border-radius:18px 18px 0 0;border-bottom:0;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet .22s ease}
  .modal:before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-10px auto 16px}
  input,select,textarea{font-size:16px}
  input,select{height:44px}
  .btn{height:42px;padding:0 15px;font-size:14.5px}
  .btn-sm{height:38px;padding:0 13px;font-size:14px}
  .btn-icon{width:42px}
  .tick{width:24px;height:24px}
  .row.task{grid-template-columns:24px 1fr}
  .log.fu{grid-template-columns:24px 1fr 24px}
  .log .x{font-size:22px}
  .toast{bottom:calc(146px + env(safe-area-inset-bottom));white-space:normal;border-radius:16px;width:calc(100vw - 32px);justify-content:space-between}
  .card{padding:18px}
  .card .actions .btn{flex:1 1 auto}
  .toolbar .btn{flex:1 1 auto}
  .search{max-width:none;flex:1 1 100%}
  .day-add{padding:10px}
  .ev{padding:10px}
  .entry{grid-template-columns:1fr}
}

/* header backup buttons */

<script>
/* Orbit: a research-informed friendship tracker.
   All data stays on the device, in this browser or the installed Home Screen app (localStorage).
   Nothing is ever sent to a server. Settings > Export to back up.
   Internally, in-person interactions use the type key 'hangout'. */

const KEY = 'orbit.v1';
const APP_VERSION = '15';   // keep in step with VERSION in sw.js

// Default cadences in days. Based on Dunbar's layers and friendship decay research,
// tuned for early/mid-20s. Editable in Settings and per person.
const LEVELS = {
  friend: {
    1: { label: 'Inner circle',  hint: `Your ~5 people. Who you'd call in a crisis.`, cap: 5,   text: 3,  hang: 10 },
    2: { label: 'Close friend',  hint: 'The next ~10 (about 15 total).',                cap: 10,  text: 7,  hang: 21 },
    3: { label: 'Good friend',   hint: 'The next ~35 (about 50 total).',                cap: 35,  text: 14, hang: 45 },
    4: { label: 'Casual friend', hint: 'The rest of your ~150.',                        cap: 100, text: 30, hang: 90 },
  },
  acq: {
    1: { label: 'High interest',   hint: 'I really want this to become a friendship.', text: 5,  hang: 10 },
    2: { label: 'Medium interest', hint: `I'd like to get to know them more.`,         text: 10, hang: 21 },
    3: { label: 'Low interest',    hint: 'Keep the door open, no pressure.',           text: 21, hang: 45 },
  }
};
const WEIGHT = { friend: {1:1.45, 2:1.3, 3:1.12, 4:1}, acq: {1:1.38, 2:1.15, 3:1} };
const MAX_RATIO = 3;   // stops one long-neglected person from outranking everyone closer
// Hall (2019): approximate hours together to reach each level.
const MILESTONES = [ {h:50, label:'Casual friend'}, {h:90, label:'Friend'}, {h:200, label:'Close friend'} ];
const TYPE_LABEL = { text: 'Text', call: 'Call', hangout: 'In person' };
const REPEAT_LABEL = { '': 'Does not repeat', weekly: 'Every week', biweekly: 'Every 2 weeks', monthly: 'Every month' };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* utils */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const since = s => diffDays(s, today());
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const pick = (arr, seed) => arr[hash(seed) % arr.length];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const people = n => n === 1 ? '1 person' : `${n} people`;
const fmtH = h => `${Math.round(h * 10) / 10}h`;
const weekStart = s => addDays(s, -((parseD(s).getDay() + 6) % 7));   // Monday
const wd = s => parseD(s).toLocaleDateString(undefined, { weekday: 'short' });
const maxDate = arr => arr.filter(Boolean).reduce((m, x) => (!m || x > m ? x : m), null);
const byDate = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
const RB = 'tabindex="0" role="button"';
const isStandalone = () => window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let installPrompt = null;   // Android/Chrome install event
const SHARE_SVG = '<span class="share-glyph"><svg viewBox="0 0 14 16"><path d="M7 1v9M3.8 4.2 7 1l3.2 3.2M4.5 7H2.5v8h9V7h-2"/></svg></span>';
const TAB_ICONS = {
  week: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M3.5 6.5l1.3 1.3L7.2 5.4M3.5 12l1.3 1.3 2.4-2.4M3.5 17.5l1.3 1.3 2.4-2.4"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  people: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.8-3.3 3-5.2 5.5-5.2s4.7 1.9 5.5 5.2"/><circle cx="16.8" cy="9.6" r="2.5"/><path d="M15.8 14.4c2.3.2 4 1.8 4.8 4.9"/>',
  insights: '<path d="M5 20v-7M10 20V5.5M15 20v-9.5M20 20V8.5"/>',
  settings: '<path d="M4 7h9.5M18.5 7H20M4 17h3.5M12.5 17H20"/><circle cx="16" cy="7" r="2.3"/><circle cx="10" cy="17" r="2.3"/>',
};
function ago(n) {
  if (n == null) return 'never';
  if (n < 0) return 'upcoming';
  if (n === 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 14) return `${n} days ago`;
  if (n < 60) return `${Math.round(n / 7)} weeks ago`;
  if (n < 365) return `${Math.round(n / 30)} months ago`;
  return `${(n / 365).toFixed(1)} years ago`;
}
function nice(s) {
  const opt = { month: 'short', day: 'numeric' };
  if (s.slice(0, 4) !== today().slice(0, 4)) opt.year = 'numeric';
  return parseD(s).toLocaleDateString(undefined, opt);
}
function rangeLabel(ws) {
  const a = parseD(ws), b = parseD(addDays(ws, 6));

  return a.getMonth() === b.getMonth() ? `${m(a)} ${a.getDate()} – ${b.getDate()}` : `${m(a)} ${a.getDate()} – ${m(b)} ${b.getDate()}`;
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}${m ? ':' + pad(m) : ''}${h < 12 ? 'am' : 'pm'}`;

function dueIn(rem) {
  if (rem < 0) return `${-rem}d overdue`;
  if (rem === 0) return 'Due today';
  return `In ${rem}d`;
}

  const n = diffDays(today(), d);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';

      <button class="btn btn-sm btn-primary" onclick="App.install()">Install</button><button class="btn btn-sm btn-quiet" onclick="App.dismissInstall()">Hide</button></div>`;
  return '';
}
function needsBackup() {
  const st = state.settings;
  if (state.people.length < 3) return false;
  if (st.backupSnooze && since(st.backupSnooze) < 14) return false;
  if (!st.lastBackup) return since(state.people.reduce((m, p) => p.created < m ? p.created : m, today())) >= 14;
  return since(st.lastBackup) >= 30;
}

/* pieces */
function tag(p) {
  let t = '';
  if (p.kind === 'acq') t += '<span class="tag tag-acq">Acquaintance</span>';
  else if (p.promotedAt) t += `<span class="tag tag-grew" title="Became a friend on ${nice(p.promotedAt)}">Grew from acquaintance</span>`;
  if (p.remote) t += `<span class="tag tag-ld">Long distance</span>`;
  return t;
}
function meta(p, parts = []) {
  return `<div class="meta">${tag(p)}<span>${[levelInfo(p).label, ...parts].filter(Boolean).map(esc).join(' · ')}</span></div>`;
}
function status(kind, text) { return `<span class="status s-${kind}">${esc(text)}</span>`; }
function dueStatus(due) {
  const rem = diffDays(today(), due);
  if (rem < 0) return status(-rem > 3 ? 'overdue' : 'due', `${-rem}d overdue`);
  if (rem === 0) return status('due', 'Due today');
  return status('soon', `By ${wd(due)}`);
}
function extraLines(p, s, ws, we) {
  let h = '';
  const b = p.birthday && nextBirthday(p, ws);
  if (b && b <= we) h += `<p class="note"><b>Birthday</b>&ensp;${relDay(b)}</p>`;
  for (const f of openFollowUps(p).slice(0, 2)) h += `<p class="note"><b>Follow up</b>&ensp;${esc(f.text)}${f.date ? ` (${relDay(f.date)})` : ''}</p>`;
  const ints = (p.interests || '').split(',').map(x => x.trim()).filter(Boolean);
  if (ints.length) h += `<p class="note"><b>Into</b>&ensp;${esc(ints.join(', '))}</p>`;
  if (s.noteLog) h += `<p class="note"><b>${nice(s.noteLog.date)}</b>&ensp;${esc(s.noteLog.note)}</p>`;
  return h;
}
const eventWhen = e => `${wd(e.date)} ${nice(e.date)}${e.time ? ', ' + fmtTime(e.time) : ''}`;

/* nav */
function remainingThisWeek() {
  const plan = weekPlan(weekStart(today()));
  return plan.see.filter(x => !x.done && !x.planned).length + plan.text.filter(x => !x.done).length;
}
function renderNav() {
  const left = activePeople().length ? remainingThisWeek() : 0;
  const tabs = [['week', 'This week'], ['calendar', 'Calendar'], ['people', 'People'], ['insights', 'Insights'], ['settings', 'Settings']];
  $('#nav').innerHTML = tabs.map(([k, l]) =>
    `<button class="${view === k || (k === 'settings' && view === 'science') ? 'on' : ''}" onclick="App.go('${k}')">${l}${k === 'week' && left ? `<span class="n" title="Still to do this week">${left}</span>` : ''}</button>`).join('');
  $('#hdr-actions').innerHTML = `
    <button class="hbtn" onclick="App.exportData()" title="Save a copy of your data" aria-label="Export backup">
      <svg viewBox="0 0 16 16"><path d="M8 10V2M5 5l3-3 3 3M3 9v4.5h10V9"/></svg><span class="lbl">Export</span></button>
    <label class="hbtn" title="Restore from a backup file" aria-label="Import backup">
      <svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 9v4.5h10V9"/></svg><span class="lbl">Import</span>
      <input type="file" accept="application/json,.json" style="display:none" onchange="App.importData(this.files[0]);this.value=''"></label>`;
  const short = [['week', 'Week'], ['calendar', 'Calendar'], ['people', 'People'], ['insights', 'Insights'], ['settings', 'Settings']];
  $('#tabbar').innerHTML = short.map(([k, l]) =>
    `<button class="${view === k || (k === 'settings' && view === 'science') ? 'on' : ''}" onclick="App.go('${k}')" aria-label="${l}"><svg viewBox="0 0 24 24">${TAB_ICONS[k]}</svg>${l}${k === 'week' && left ? `<span class="n">${left}</span>` : ''}</button>`).join('');
}
function render() {
  document.body.dataset.view = view;
  materialize(addDays(maxDate([today(), calWeek]), 42));
  renderNav();
  $('#main').innerHTML = ({ week: renderWeek, calendar: renderCalendar, people: renderPeople, insights: renderInsights, science: renderScience, settings: renderSettings })[view]();
}

function emptyState() {
  return `<div class="empty">
    <div class="orbit"></div>
    <h1>Keep up with your people.</h1>
    <p class="lede">Add your friends and the people you've just met. Each week, Orbit suggests who to see and who to message, based on how close you are and what research says about how friendships grow and fade.</p>
    <div class="actions">
      <button class="btn btn-primary" onclick="App.personForm()">Add a person</button>
      <button class="btn" onclick="App.bulkForm()">Add several at once</button>
      <button class="btn btn-quiet" onclick="App.loadSample()">Explore with sample data</button>
    </div></div>`;
}

/* this week */
const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
// one short line worth knowing: an undated follow-up (dated ones and birthdays already sit under Don't forget)
function todoNote(p) {
  const f = openFollowUps(p).find(f => !f.date);
  return f ? `Follow up: ${esc(f.text)}` : '';
}
const shortDay = d => { const n = diffDays(d, today()); return n === 0 ? 'today' : n === 1 ? 'yesterday' : wd(d); };
function todoRow({ p, kind, done, tickClass, tickAction, tickLabel, sub, right, note }) {
  return `<div class="todo ${done ? 'is-done' : ''}" ${RB} onclick="App.rowSheet('${p.id}','${kind}')">
    <button class="tick ${tickClass || ''}" aria-label="${esc(tickLabel)}" title="${esc(tickLabel)}" onclick="event.stopPropagation();${tickAction}">${done ? CHECK_SVG : ''}</button>
    <div class="todo-main"><div class="todo-name">${esc(p.name)}${tag(p)}</div><div class="todo-sub">${esc(sub)}</div>${note ? `<div class="todo-note">${note}</div>` : ''}</div>
    <div class="todo-right">${right}</div></div>`;
}
function renderWeek() {
  if (!activePeople().length) return emptyState();
  const t = today(), ws = weekStart(t);
  const plan = weekPlan(ws, showAll);
  const items = [...plan.see, ...plan.text];
  const total = items.length;
  const done = items.filter(x => x.done).length;
  const planned = plan.see.filter(x => !x.done && x.planned).length;
  const toGo = total - done - planned;
  const daysLeft = diffDays(t, plan.we) + 1;

  let h = `<div class="eyebrow">${rangeLabel(ws)} · ${plural(daysLeft, 'day')} left</div>
    <h1>This week.</h1>
    ${total ? `<div class="week-progress"><div class="bar2"><span class="d" style="width:${done / total * 100}%"></span><span class="p" style="width:${planned / total * 100}%"></span></div><span>${[toGo ? `${toGo} to go` : 'All done', done ? `${done} done` : '', planned ? `${planned} planned` : ''].filter(Boolean).join(' · ')}</span></div>` : ''}`;

  // notices: install prompt, and past plans waiting for a yes/no
  const onRows = new Set(plan.see.map(x => x.planned?.id).filter(Boolean));
  const pending = state.events.filter(e => !e.done && e.date < t && !onRows.has(e.id)).sort(byDate).reverse();
  const rows = pending.map(e => `<div class="banner-row">
      <div class="grow"><b>Did this happen?</b> <span class="muted">${esc(e.title)} · ${eventWhen(e)}${e.personIds.length ? ' · ' + esc(listNames(names(e.personIds))) : ''}</span></div>
      <button class="btn btn-sm btn-primary" onclick="App.confirmEvent('${e.id}')">Yes</button>
      <button class="btn btn-sm btn-quiet" onclick="App.cancelEvent('${e.id}')">No</button></div>`);
  const ins = installBanner();
  if (ins) rows.unshift(ins);
  if (hasSample()) rows.unshift(`<div class="banner-row"><div class="grow"><b>You're viewing sample data.</b> <span class="muted">Remove it to start with your own people.</span></div>
      <button class="btn btn-sm btn-primary" onclick="App.removeSample()">Remove sample data</button></div>`);
  if (rows.length) h += `<div class="banner">${rows.join('')}</div>`;

  // don't forget: birthdays and dated follow-ups
  const soonEnd = maxDate([plan.we, addDays(t, 7)]);
  const bdays = activePeople().map(p => ({ p, d: p.birthday && nextBirthday(p, ws) })).filter(x => x.d && x.d <= soonEnd).sort((a, b) => a.d.localeCompare(b.d));
  const fus = activePeople().flatMap(p => openFollowUps(p).filter(f => f.date && f.date <= plan.we).map(f => ({ p, f }))).sort((a, b) => a.f.date.localeCompare(b.f.date));
  if (bdays.length || fus.length) {
    h += `<div class="section"><div class="eyebrow">Don't forget</div></div><div class="todos">`;
    h += bdays.map(({ p, d }) => `<div class="todo" ${RB} onclick="App.detail('${p.id}')"><span class="ring" style="margin-top:1px"></span>
      <div class="todo-main"><div class="todo-name">${esc(p.name)}'s birthday</div><div class="todo-sub">${esc(levelInfo(p).label)}</div></div>
      <div class="todo-right">${status(d < t ? 'soon' : diffDays(t, d) <= 1 ? 'due' : 'plan', relDay(d))}</div></div>`).join('');
    h += fus.map(({ p, f }) => `<div class="todo" ${RB} onclick="App.detail('${p.id}')"><button class="tick" title="Mark done" aria-label="Mark done" onclick="event.stopPropagation();App.fuDone('${p.id}','${f.id}')"></button>
      <div class="todo-main"><div class="todo-name">${esc(f.text)}</div><div class="todo-sub">${esc(p.name)}</div></div>
      <div class="todo-right">${status(f.date < t ? 'overdue' : f.date === t ? 'due' : 'plan', relDay(f.date))}</div></div>`).join('');
    h += `</div>`;
  }

  if (!total) h += `<div class="quiet-box" style="margin-top:44px"><h3>All caught up.</h3><p style="margin:0">Everyone is on track this week.</p></div>`;

  if (plan.see.length) {
    h += `<div class="section"><div class="eyebrow">See in person<span>${plan.see.filter(x => x.done).length}/${plan.see.length}</span></div></div><div class="todos">`;
    const open = plan.see.filter(x => !x.done && !x.planned);
    const byGroup = {};
    for (const x of open) for (const g of x.p.groups || []) (byGroup[g] = byGroup[g] || []).push(x.p.id);
    groupSugs = Object.entries(byGroup).filter(([, ids]) => ids.length >= 2).sort((a, b) => b[1].length - a[1].length).slice(0, 1);
    for (const [g, ids] of groupSugs) h += `<div class="group-hint"><span><b>${esc(g)}</b>: ${esc(listNames(names(ids)))} are all due.</span><button class="btn btn-sm" onclick="App.planGroup(0)">Plan together</button></div>`;
    for (const it of plan.see) {
      const { p } = it, s = stats(p), e = it.planned;
      const seen = s.lastHang ? `last seen ${ago(since(s.lastHang))}` : 'not seen yet';
      if (it.done) h += todoRow({ p, kind: 'see', done: true, tickClass: 'done', tickAction: `App.detail('${p.id}')`, tickLabel: 'Done', sub: `Saw them ${shortDay(it.done.date)}${+it.done.hours ? ` · ${fmtH(+it.done.hours)}` : ''}`, right: status('good', 'Done') });
      else if (e && e.date < t) h += todoRow({ p, kind: 'see', tickAction: `App.confirmEvent('${e.id}')`, tickLabel: 'It happened', sub: `${e.title} · ${eventWhen(e)}`, right: status('due', 'Did it happen?') });
      else if (e) h += todoRow({ p, kind: 'see', tickClass: 'plan', tickAction: `App.timeSheet('${p.id}')`, tickLabel: 'Log time together', sub: `${e.title} · ${wd(e.date)}${e.time ? ' ' + fmtTime(e.time) : ''}`, right: status('plan', `Planned ${e.date > plan.we ? relDay(e.date) : wd(e.date)}`), note: todoNote(p) });
      else h += todoRow({ p, kind: 'see', tickAction: `App.timeSheet('${p.id}')`, tickLabel: 'Log time together', sub: `${levelInfo(p).label} · ${seen}`, right: dueStatus(it.due), note: todoNote(p) });
    }
    h += `</div>`;
  }

  if (plan.text.length) {
    h += `<div class="section"><div class="eyebrow">Check in<span>${plan.text.filter(x => x.done).length}/${plan.text.length}</span></div></div><div class="todos">`;
    for (const it of plan.text) {
      const { p } = it, s = stats(p);
      const last = s.lastAny ? `last talked ${ago(since(s.lastAny))}` : 'no contact yet';
      if (it.done) h += todoRow({ p, kind: 'text', done: true, tickClass: 'done', tickAction: `App.detail('${p.id}')`, tickLabel: 'Done', sub: s.lastAny ? `Talked ${shortDay(s.lastAny)}` : 'Done', right: status('good', 'Done') });
      else h += todoRow({ p, kind: 'text', tickAction: `App.quickLog('${p.id}','text')`, tickLabel: 'Checked in',
        sub: [levelInfo(p).label, last].filter(Boolean).join(' · '),
        right: it.times > 1 ? status(it.count ? 'soon' : 'due', `${it.count} of ${it.times}`) : dueStatus(it.due), note: todoNote(p) });
    }
    h += `</div>`;
  }

  if (plan.hidden > 0) h += `<p class="muted small" style="margin-top:18px">${plan.hidden} more could use attention. <button class="linkish" onclick="App.toggleAll()">Show all</button></p>`;
  else if (showAll) h += `<p class="muted small" style="margin-top:18px"><button class="linkish" onclick="App.toggleAll()">Show fewer</button></p>`;
  return h;
}

/* calendar */
function renderCalendar() {
  const ws = calWeek, we = addDays(ws, 6), t = today();
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const isThis = ws === weekStart(t);
  const logsW = state.logs.filter(l => l.date >= ws && l.date <= we && person(l.personId));
  const evsW = state.events.filter(e => e.date >= ws && e.date <= we);

  let h = `<div class="cal-head"><div><div class="eyebrow">${isThis ? 'This week' : ws < weekStart(t) ? 'Past week' : 'Upcoming week'}</div><h1>${rangeLabel(ws)}<span class="muted" style="font-size:.55em;margin-left:10px">${parseD(ws).getFullYear()}</span></h1></div>
    <div class="cal-nav">
      <button class="btn btn-icon" onclick="App.calShift(-7)" aria-label="Previous week">&lsaquo;</button>
      <button class="btn" onclick="App.calShift(0)" ${isThis ? 'disabled style="opacity:.5"' : ''}>Today</button>
      <button class="btn btn-icon" onclick="App.calShift(7)" aria-label="Next week">&rsaquo;</button>
    </div></div>
  <div class="cal">`;
  for (const d of days) {
    const evs = evsW.filter(e => e.date === d).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    const logs = logsW.filter(l => l.date === d && !l.eventId);
    const inPerson = logs.filter(l => l.type === 'hangout');   // calendar shows plans and time in person only
    const bdays = activePeople().filter(p => p.birthday && bdayIn(+d.slice(0, 4), p.birthday) === d);
    h += `<div class="day ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}">
      <div class="day-head"><span class="day-name">${wd(d)}</span><span class="day-num">${parseD(d).getDate()}</span></div>
      <div class="day-body">
      ${bdays.map(p => `<button class="ev bday" onclick="App.detail('${p.id}')"><span class="t">Birthday</span><b>${esc(p.name)}</b></button>`).join('')}
      ${evs.map(e => `<button class="ev ${e.done ? 'done' : e.date < t ? 'confirm' : ''}" onclick="App.eventForm('${e.id}')">
        <span class="t">${e.time ? fmtTime(e.time) : 'Any time'}${seriesOf(e)?.repeat ? ' · repeats' : ''}</span><b>${esc(e.title)}</b>${e.personIds.length ? `<span class="who">${esc(names(e.personIds).join(', '))}</span>` : ''}</button>`).join('')}
      ${inPerson.map(l => `<button class="ev log" onclick="App.detail('${l.personId}')"><span class="t">In person${+l.hours ? ' · ' + fmtH(+l.hours) : ''}</span><b>${esc(person(l.personId).name)}</b>${l.note ? `<span class="who">${esc(l.note)}</span>` : ''}</button>`).join('')}
      <button class="day-add" onclick="App.eventForm(null,{date:'${d}'})">+ Add</button>
      </div>
    </div>`;
  }
  h += `</div>`;
  const hrs = logsW.filter(l => l.type === 'hangout').reduce((s, l) => s + (+l.hours || 0), 0);
  const seen = new Set(logsW.filter(l => l.type === 'hangout').map(l => l.personId)).size;
  h += `<div class="cal-sum"><span><b>${evsW.length}</b> ${evsW.length === 1 ? 'activity' : 'activities'}</span><span><b>${people(seen)}</b> seen in person</span><span><b>${fmtH(hrs)}</b> together</span></div>`;
  return h;
}

/* people */
function renderPeople() {
  let ppl = state.people.filter(p => !p.archived);
  if (pf.kind === 'friend') ppl = ppl.filter(p => p.kind === 'friend');
  if (pf.kind === 'acq') ppl = ppl.filter(p => p.kind === 'acq');
  if (pf.kind === 'remote') ppl = ppl.filter(p => p.remote);
  if (pf.kind === 'archived') ppl = state.people.filter(p => p.archived);
  if (pf.group) ppl = ppl.filter(p => (p.groups || []).includes(pf.group));
  if (pf.q) { const q = pf.q.toLowerCase(); ppl = ppl.filter(p => [p.name, p.interests, p.metAt, p.notes, (p.groups || []).join(' ')].join(' ').toLowerCase().includes(q)); }
  const S = new Map(ppl.map(p => [p.id, stats(p)]));
  const urg = p => { const s = S.get(p.id); return Math.max(s.tSkipped ? 0 : s.tScore, s.hSkipped ? 0 : s.hScore); };
  if (pf.sort === 'urgency') ppl.sort((a, b) => urg(b) - urg(a));
  else if (pf.sort === 'name') ppl.sort((a, b) => a.name.localeCompare(b.name));
  else if (pf.sort === 'level') ppl.sort((a, b) => (a.kind === b.kind ? lvl(a) - lvl(b) : a.kind === 'friend' ? -1 : 1) || a.name.localeCompare(b.name));
  else if (pf.sort === 'recent') ppl.sort((a, b) => (S.get(a.id).lastAny ? S.get(a.id).tDays : 1e9) - (S.get(b.id).lastAny ? S.get(b.id).tDays : 1e9));

  const nF = state.people.filter(p => !p.archived && p.kind === 'friend').length;
  const nL = state.people.filter(p => !p.archived && p.remote).length;
  const nA = state.people.filter(p => !p.archived && p.kind === 'acq').length;
  const nX = state.people.filter(p => p.archived).length;
  const groups = allGroups();
  if (pf.group && !groups.includes(pf.group)) pf.group = '';
  const tab = (k, l) => `<button class="${pf.kind === k ? 'on' : ''}" onclick="App.pf('kind','${k}')">${l}</button>`;

  let h = `<div class="eyebrow">${plural(nF, 'friend')} · ${plural(nA, 'acquaintance')}${nL ? ` · ${nL} long distance` : ''}</div><h1>People</h1>
  <div class="toolbar">
    <input class="search" id="q" placeholder="Search" value="${esc(pf.q)}" oninput="App.search(this.value)">
    <div class="seg-tabs">${tab('all', 'All')}${tab('friend', 'Friends')}${tab('acq', 'Acquaintances')}${nL ? tab('remote', 'Long distance') : ''}${nX ? tab('archived', 'Archived') : ''}</div>
    ${groups.length ? `<select class="inline" onchange="App.pf('group',this.value)"><option value="">All groups</option>${groups.map(g => `<option value="${esc(g)}" ${pf.group === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
  </div>`;
  if (!state.people.length) return h + emptyState();
  if (!ppl.length) return h + `<p class="muted" style="margin-top:32px">No one matches.</p>`;
  h += `<div class="rows" style="margin-top:28px">`;
  for (const p of ppl) {
    const s = S.get(p.id);
    const prog = p.kind === 'acq' ? `<div class="bar" style="margin-top:9px;max-width:200px" title="${fmtH(s.hours)} of about 50h to casual friend"><span style="width:${Math.min(100, s.hours / 50 * 100)}%"></span></div>` : '';
    // one status: whichever is more pressing
    let label, st;
    if (!p.remote && s.upcoming[0]) { label = 'See'; st = status('plan', `Planned ${relDay(s.upcoming[0].date)}`); }
    else if (!p.remote && !s.hSkipped && s.hRatio >= s.tRatio) { label = 'See'; st = status(statusOf(s.hRatio), dueIn(s.hangRem)); }
    else { label = 'Check in'; st = s.tSkipped ? '<span class="muted">Skipped</span>' : status(statusOf(s.tRatio), dueIn(s.textRem)); }
    h += `<div class="row simple" ${RB} onclick="App.detail('${p.id}')">
      <span class="dot s-${s.status}" title="${STATUS_LABEL[s.status]}"></span>
      <div class="row-main"><div class="name">${esc(p.name)}</div>${meta(p, [s.lastAny ? `last contact ${ago(since(s.lastAny))}` : ''])}${prog}</div>
      <div class="cell right"><span class="cell-label">${label}</span>${st}</div>
    </div>`;
  }
  return h + `</div>`;
}

/* insights */
function renderInsights() {
  const ppl = activePeople();
  if (!ppl.length) return `<h1>Insights</h1>` + emptyState();
  const S = new Map(ppl.map(p => [p.id, stats(p)]));
  const cutoff = addDays(today(), -30);
  const recent = state.logs.filter(l => l.date > cutoff && l.date <= today() && person(l.personId));
  const cnt = t => recent.filter(l => l.type === t).length;
  const hrs = recent.filter(l => l.type === 'hangout').reduce((s, l) => s + (+l.hours || 0), 0);
  const onTrack = ppl.filter(p => S.get(p.id).tRatio < 1 && (p.remote || S.get(p.id).hRatio < 1 || S.get(p.id).upcoming.length)).length;
  const reached = new Set(recent.map(l => l.personId)).size;

  let h = `<div class="eyebrow">Last 30 days</div><h1>Insights</h1>
  <div class="stats">
    <div class="stat"><b>${Math.round(onTrack / ppl.length * 100)}%</b><span>On track</span></div>
    <div class="stat"><b>${reached}</b><span>People reached</span></div>
    <div class="stat"><b>${cnt('text') + cnt('call')}</b><span>Texts and calls</span></div>
    <div class="stat"><b>${cnt('hangout')}</b><span>Times in person</span></div>
    <div class="stat"><b>${fmtH(hrs)}</b><span>Time together</span></div>
  </div>`;

  // tier check
  const checks = tierChecks();
  if (checks.length) {
    h += `<div class="section"><div class="eyebrow">Check your tiers<span>${checks.length}</span></div><div class="section-note">Keeps the weekly plan matched to reality</div></div><div class="rows">`;
    h += checks.map(c => {
      const target = c.action === 'archive' ? 'Archive' : `Move to ${LEVELS.friend[c.to].label.toLowerCase()}`;
      const q = c.action === 'up' ? `Closer than a ${levelInfo(c.p).label.toLowerCase()}?` : c.action === 'down' ? 'Ease off to a looser tier?' : c.p.kind === 'acq' ? 'Let this one go for now?' : 'Archive for now?';
      return `<div class="row simple" style="cursor:default"><span class="dot s-${c.action === 'up' ? 'good' : 'due'}"></span>
        <div class="row-main"><div class="name"><button class="name" onclick="App.detail('${c.p.id}')">${esc(c.p.name)}</button></div><div class="meta"><span>${esc(c.why)}. ${esc(q)}</span></div></div>
        <div class="actions" style="margin:0;flex-wrap:nowrap"><button class="btn btn-sm" onclick="App.applyTier('${c.p.id}','${c.action}',${c.to || 0})">${target}</button><button class="btn btn-sm btn-quiet" onclick="App.dismissTier('${c.p.id}')">Keep</button></div></div>`;
    }).join('') + `</div>`;
  }

  h += `<div class="section"><div class="eyebrow">Your circles</div><div class="section-note">Compared with Dunbar's layers</div></div>
  <table><tr><th>Tier</th><th>People</th><th>Typical capacity</th><th>Check in / see</th></tr>`;
  for (const l of [1, 2, 3, 4]) {
    const L = LEVELS.friend[l], n = ppl.filter(p => p.kind === 'friend' && p.tier === l).length, iv = state.settings.intervals.friend[l];
    h += `<tr><td>${L.label}</td><td>${n > L.cap ? status('due', `${n}, over capacity`) : n}</td><td class="muted">about ${L.cap}</td><td class="muted">every ${iv.text}d / ${iv.hang}d</td></tr>`;
  }
  h += `</table><p class="muted small" style="margin-top:14px;max-width:620px">Each layer is about three times the size of the one inside it. Only a handful of people can stay at weekly closeness at once, so honest tiers keep suggestions realistic.</p>`;

  const acqs = ppl.filter(p => p.kind === 'acq').sort((a, b) => S.get(b.id).hours - S.get(a.id).hours);
  h += `<div class="section"><div class="eyebrow">Acquaintances<span>${acqs.length}</span></div><div class="section-note">About 50 hours to a casual friendship (Hall, 2019)</div></div>`;
  if (!acqs.length) h += `<p class="muted">No acquaintances yet. <button class="linkish" onclick="App.personForm(null,'acq')">Add someone you've just met</button></p>`;
  else {
    h += `<div class="rows">`;
    for (const p of acqs) {
      const s = S.get(p.id);
      const start = p.metDate || p.created;
      const weeks = Math.max(1, since(start) / 7);
      const pace = s.hours / weeks;
      const left = Math.max(0, 50 - s.hours);
      const eta = left === 0 ? 'Ready to promote' : pace > 0 ? `about ${Math.ceil(left / pace)} weeks to go at this pace` : 'log time together to start';
      const cold = s.tDays > 45;
      h += `<div class="row simple" ${RB} onclick="App.detail('${p.id}')"><span class="dot s-${s.status}"></span>
        <div class="row-main"><div class="name">${esc(p.name)}</div>
          <div class="meta"><span>${esc([levelInfo(p).label, `${pace.toFixed(1)}h per week`, eta].join(' · '))}</span>${cold ? status('overdue', 'Going cold') : ''}</div>
          <div class="bar" style="margin-top:10px"><span style="width:${Math.min(100, s.hours / 50 * 100)}%"></span></div></div>
        <div class="cell right"><span class="cell-label">Together</span><span>${fmtH(s.hours)} / 50h</span></div></div>`;
    }
    h += `</div>`;
  }

  // reciprocity
  const bal = ppl.map(p => ({ p, b: balance(p) })).filter(x => x.b.n >= 6 && (x.b.me / x.b.n >= 0.8 || x.b.them / x.b.n >= 0.6)).sort((a, b) => b.b.me / b.b.n - a.b.me / a.b.n);
  if (bal.length) {
    h += `<div class="section"><div class="eyebrow">Who reaches out</div><div class="section-note">Last 6 months</div></div><div class="rows">`;
    h += bal.map(({ p, b }) => `<div class="row simple" ${RB} onclick="App.detail('${p.id}')"><span class="dot s-${b.me / b.n >= 0.8 ? 'due' : 'good'}"></span>
      <div class="row-main"><div class="name">${esc(p.name)}</div><div class="meta"><span>${b.me / b.n >= 0.8 ? `You started ${b.me} of the last ${b.n}. Worth noticing whether it's mutual.` : `They started ${b.them} of the last ${b.n}. Return the effort.`}</span></div></div>
      <div class="cell right"><span class="cell-label">You / them</span><span>${b.me} / ${b.them}</span></div></div>`).join('') + `</div>
      <p class="muted small" style="margin-top:12px;max-width:620px">Some people are just bad at texting. Treat this as a signal, not a verdict.</p>`;
  }

  const neglected = ppl.filter(p => (!p.remote && S.get(p.id).hRatio >= 1.5 && !S.get(p.id).upcoming.length) || S.get(p.id).tRatio >= 1.5)
    .sort((a, b) => Math.max(S.get(b.id).hScore, S.get(b.id).tScore) - Math.max(S.get(a.id).hScore, S.get(a.id).tScore)).slice(0, 6);
  if (neglected.length) {
    h += `<div class="section"><div class="eyebrow">Slipping<span>${neglected.length}</span></div><div class="section-note">Well past their usual cadence</div></div><div class="rows">`;
    for (const p of neglected) {
      const s = S.get(p.id);
      h += `<div class="row simple" ${RB} onclick="App.detail('${p.id}')"><span class="dot s-overdue"></span>
        <div class="row-main"><div class="name">${esc(p.name)}</div>${meta(p)}</div>
        ${p.remote ? `<div class="cell right"><span class="cell-label">Last contact</span><span>${s.lastAny ? ago(since(s.lastAny)) : 'Not logged'}</span></div>`
          : `<div class="cell right"><span class="cell-label">Last seen</span><span>${s.lastHang ? ago(since(s.lastHang)) : 'Not logged'}</span></div>`}</div>`;
    }
    h += `</div>`;
  }

  const grown = ppl.filter(p => p.kind === 'friend' && p.promotedAt);
  if (grown.length) {
    h += `<div class="section"><div class="eyebrow">Friendships you grew<span>${grown.length}</span></div></div><div class="rows">` +
      grown.map(p => `<div class="row simple" ${RB} onclick="App.detail('${p.id}')"><span class="dot s-good"></span><div class="row-main"><div class="name">${esc(p.name)}</div>${meta(p)}</div><div class="cell right"><span class="cell-label">Friends since</span><span>${nice(p.promotedAt)}</span></div></div>`).join('') + `</div>`;
  }
  return h;
}

/* research */
function renderScience() {
  const items = [
    [`Dunbar's circles`,
      `People keep friends in nested layers of about <b>5, 15, 50, and 150</b>, each roughly three times the size of the one inside it. How often you're in contact drops as you move outward: the innermost layer about weekly, the next about monthly, the outermost about once a year.`,
      `Friend tiers map onto these layers, and each has its own cadence for checking in and seeing each other. Insights flags a tier that's over capacity and suggests moving people when how often you actually see them doesn't match their tier.`,
      `Dunbar (2018), The Anatomy of Friendship, Trends in Cognitive Sciences. Hill and Dunbar (2003). Sutcliffe, Dunbar et al. (2012).`],
    [`Friendships fade without contact`,
      `In an 18-month study of young adults moving to university, emotional closeness with friends dropped when contact dropped. Family ties held up much better. Friendships need regular upkeep.`,
      `Every person has a timer. When it's about to run out, they show up in your weekly plan before the friendship has a chance to drift.`,
      `Roberts and Dunbar (2011), Evolution and Human Behavior.`],
    [`Hours make friends`,
      `It takes roughly <b>50 hours</b> together to go from acquaintance to casual friend, about <b>90</b> to become friends, and <b>200 or more</b> to become close friends. Free time spent together counted toward closeness. Time together only at work or school counted much less.`,
      `Time in person is logged in hours. Each acquaintance has a progress bar toward 50 hours, and Orbit suggests promoting them when they get there.`,
      `Hall (2019), How many hours does it take to make a friend? Journal of Social and Personal Relationships.`],
    [`Start strong with new people`,
      `Seeing someone repeatedly makes you like each other more, and being physically nearby is one of the strongest predictors of who becomes friends. The time you spend together in the first few months after meeting matters a lot.`,
      `Acquaintances you're very interested in get the most frequent nudges: a message about every 5 days and time together about every 10.`,
      `Zajonc (1968). Festinger, Schachter and Back (1950). Hall (2019).`],
    [`Plans beat good intentions`,
      `People are much more likely to follow through on something when they decide in advance when and where they'll do it. Researchers call these "implementation intentions." "We should get dinner" rarely happens. "Thursday, 7pm" usually does.`,
      `The weekly plan asks you to schedule, not just remember. Plans can repeat, so a standing weekly or monthly thing takes no re-planning, and you can export any plan to your calendar app for reminders.`,
      `Gollwitzer (1999), American Psychologist. Gollwitzer and Sheeran (2006), Advances in Experimental Social Psychology.`],
    [`They like you more than you think`,
      `After a conversation, people consistently underestimate how much the other person liked them. This "liking gap" stops a lot of potential friendships from going anywhere.`,
      `Acquaintances get frequent check-in reminders so you actually follow up. The odds are better than they feel.`,
      `Boothby, Cooney, Sandstrom and Clark (2018), Psychological Science.`],
    [`Reaching out means more than you'd guess`,
      `People underestimate how much others appreciate a check-in, and the effect is biggest when the message comes out of the blue.`,
      `A check-in only needs a short message. You don't need a reason to send one.`,
      `Liu, Rim, Min and Min (2023), Journal of Personality and Social Psychology.`],
    [`Liking is mutual`,
      `People tend to like those who seem to like them back, and acting warmly because you believe someone likes you tends to make it true. Friendships last when effort flows both ways.`,
      `You can note who reached out. Insights points out friendships where you're doing nearly all the starting, and ones where they are and it's your turn.`,
      `Curtis and Miller (1986), Journal of Personality and Social Psychology. Oswald, Clark and Kelly (2004).`],
    [`In person, then voice, then text`,
      `Young adults felt the most bonded in person, then over video, then on a voice call, and the least over text. Texting is great for staying in touch and making plans, but it can't replace time together.`,
      `Check-ins and time together are tracked separately. Only seeing someone in person counts toward the "See in person" goal.`,
      `Sherman, Michikyan and Greenfield (2013), Cyberpsychology.`],
    [`Keeping long-distance friendships`,
      `Moving away is one of the most common reasons friendships fade, mostly because it removes time in person. Staying in regular contact slows the drift, and the format matters: people feel more bonded on a voice or video call than over text.`,
      `Long-distance friends only get check-ins, never suggestions to meet up. A call now and then goes further than texts alone, and visits still count as time together when you log them.`,
      `Roberts and Dunbar (2011), Evolution and Human Behavior. Sherman, Michikyan and Greenfield (2013), Cyberpsychology.`],
    [`What keeps friendships going`,
      `Four behaviours predict lasting friendships: <b>positivity</b>, <b>supportiveness</b>, <b>openness</b>, and actually spending time together. Remembering what's going on in someone's life is a big part of being supportive.`,
      `Follow-ups and birthdays surface at the right time, so you can ask how the interview went or send a message on the day.`,
      `Oswald, Clark and Kelly (2004), Journal of Social and Clinical Psychology. Aron et al. (1997). Altman and Taylor (1973).`],
    [`Why your twenties`,
      `Phone records from millions of people show that the number of people someone stays in regular contact with peaks around age 25 and then slowly shrinks. Once school ends, the built-in time with people goes away, so friendships need deliberate effort.`,
      `The default cadences are a bit more frequent than research on older adults would suggest. You can change them in Settings.`,
      `Bhattacharya et al. (2016), Royal Society Open Science.`],
  ];
  return `<div class="eyebrow">How Orbit decides</div><h1>Research</h1>
  <p class="lede">The cadences are sensible defaults based on these findings, not exact prescriptions from any single study. Adjust them in Settings or for any one person.</p>
  <div class="entries">${items.map(([t, b, u, c], i) => `<div class="entry"><div class="num">${pad(i + 1)}</div><div><h3>${t}</h3><p>${b}</p><div class="use">${u}</div><div class="cite">${c}</div></div></div>`).join('')}</div>`;
}

/* Type-to-search person picker. 'multi' keeps a list of chips; 'single' holds one person. */
const combo = { mode: 'multi', ids: [], q: '', active: 0, open: false, matches: [], nav: false };
function comboReset(mode, ids) { Object.assign(combo, { mode, ids: [...new Set(ids || [])].filter(id => person(id)), q: '', active: 0, open: false, matches: [] }); }
function comboHtml(autofocus) {
  return `<div class="combo" id="combo">
    <div class="combo-box" id="combo-box" onclick="if(event.target===this)$('#combo-input').focus()">
      <span id="combo-chips" style="display:contents">${comboChipsHtml()}</span>
      <input id="combo-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"
        role="combobox" aria-expanded="false" aria-controls="combo-list" aria-autocomplete="list"
        placeholder="${comboPlaceholder()}" ${autofocus ? 'autofocus' : ''} style="${combo.mode === 'single' && combo.ids.length ? 'display:none' : ''}"
        oninput="App.comboInput(this.value)" onfocus="App.comboFocus()" onblur="App.comboBlur()" onkeydown="App.comboKey(event)">
    </div>
    <div class="combo-list" id="combo-list" role="listbox"></div>
  </div>`;
}
const comboPlaceholder = () => combo.mode === 'single' ? 'Type a name' : combo.ids.length ? 'Add someone else' : 'Type a name or a group';
function comboChipsHtml() {
  return combo.ids.map(id => { const p = person(id); return `<span class="chip ${p.kind === 'acq' ? 'acq' : ''}" title="${p.kind === 'acq' ? 'Acquaintance' : esc(levelInfo(p).label)}"><span>${esc(p.name)}</span><button type="button" aria-label="Remove ${esc(p.name)}" onmousedown="event.preventDefault()" onclick="App.comboRemove('${id}')">&times;</button></span>`; }).join('');
}
function comboFind(q) {
  const pool = activePeople().filter(p => !combo.ids.includes(p.id));
  q = q.trim().toLowerCase();
  if (!q) {
    // nothing typed yet: suggest whoever is most due
    return pool.map(p => { const s = stats(p); return { p, k: Math.max(s.tScore, s.hScore) }; }).sort((a, b) => b.k - a.k).slice(0, 6).map(x => ({ p: x.p }));
  }
  const out = [];
  for (const p of pool) {
    const n = p.name.toLowerCase();
    let rank = n.startsWith(q) ? 0 : n.split(/\s+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : -1;
    let via = '';
    if (rank < 0 && combo.mode === 'multi') { const g = (p.groups || []).find(g => g.toLowerCase().startsWith(q)); if (g) { rank = 3; via = g; } }
    if (rank >= 0) out.push({ p, rank, via });
  }
  return out.sort((a, b) => a.rank - b.rank || a.p.name.localeCompare(b.p.name)).slice(0, 8);
}
function comboMark(name, q) {
  q = q.trim();
  const i = q ? name.toLowerCase().indexOf(q.toLowerCase()) : -1;
  return i < 0 ? esc(name) : `${esc(name.slice(0, i))}<mark>${esc(name.slice(i, i + q.length))}</mark>${esc(name.slice(i + q.length))}`;
}
function comboRender() {
  const list = $('#combo-list'), input = $('#combo-input');
  if (!list) return;
  $('#combo-chips').innerHTML = comboChipsHtml();
  if (input) {
    input.style.display = combo.mode === 'single' && combo.ids.length ? 'none' : '';
    input.placeholder = comboPlaceholder();
    input.setAttribute?.('aria-expanded', combo.open ? 'true' : 'false');
  }
  if (!combo.open) { list.innerHTML = ''; return; }
  combo.matches = comboFind(combo.q);
  combo.active = Math.min(combo.active, Math.max(0, combo.matches.length - 1));
  if (!combo.matches.length) {
    list.innerHTML = combo.q.trim() ? `<div class="combo-empty">No one matches "${esc(combo.q.trim())}". Add them from People first.</div>` : '';
    return;
  }
  list.innerHTML = (combo.q.trim() ? '' : '<div class="combo-head">Most due</div>') + combo.matches.map(({ p, via }, i) => {
    const info = via ? `in ${via}` : p.kind === 'acq' ? 'Acquaintance' : levelInfo(p).label + (p.remote ? ' · long distance' : '');
    return `<div class="combo-opt ${p.kind === 'acq' ? 'acq' : ''} ${i === combo.active ? 'on' : ''}" role="option" aria-selected="${i === combo.active}"
      onmousedown="event.preventDefault()" onclick="App.comboPick('${p.id}')" onmousemove="App.comboHover(${i})">
      <span class="nm">${comboMark(p.name, combo.q)}</span><span class="who-meta">${esc(info)}</span></div>`;
  }).join('');
}

/* toast */
let toastTimer;
function toast(msg, action, label = 'Undo') {
  clearTimeout(toastTimer);
  window.__toastAction = action;
  $('#toast-root').innerHTML = `<div class="toast" role="status"><span>${msg}</span>${action ? `<button onclick="window.__toastAction&&window.__toastAction();App.hideToast()">${label}</button>` : ''}</div>`;
  toastTimer = setTimeout(() => App.hideToast(), 6000);
}

/* actions */
function addLog(pid, type, date, hours, note, eventId, by) {
  const l = { id: uid(), personId: pid, type, date, hours: type === 'hangout' ? (+hours || 0) : 0, note: (note || '').trim(), ts: Date.now() };
  if (eventId) l.eventId = eventId;
  if (by) l.by = by;
  state.logs.push(l);
  return l;
}
function syncEventLogs(e) {
  state.logs = state.logs.filter(l => l.eventId !== e.id);
  if (e.done) for (const pid of e.personIds) if (person(pid)) addLog(pid, 'hangout', e.date, e.hours, e.title, e.id);
}
function newPerson(data) {
  return { id: uid(), created: today(), skip: {}, archived: false, promotedAt: null, groups: [], followUps: [], seed: {}, ...data };
}
function milestoneToast(p, before, fallback) {
  const after = stats(p).hours;
  const crossed = MILESTONES.find(m => before < m.h && after >= m.h);
  if (p.kind === 'acq' && before < 50 && after >= 50) { App.detail(p.id); toast(`${esc(p.name)} has reached about 50 hours. Consider promoting them to friend.`); }
  else if (crossed && p.kind === 'friend') toast(`${esc(p.name)}: ${crossed.h}+ hours together, about ${crossed.label.toLowerCase()} level`);
  else fallback();
}
function icsText(e) {
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const d = e.date.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Orbit//EN', 'BEGIN:VEVENT', `UID:${e.id}@orbit.local`, `DTSTAMP:${stamp}`];
  if (e.time) {
    const [h, m] = e.time.split(':').map(Number);
    const start = new Date(...e.date.split('-').map((x, i) => i === 1 ? +x - 1 : +x), h, m);
    const end = new Date(start.getTime() + Math.max(0.5, +e.hours || 1) * 36e5);
    const f = x => `${fmt(x).replace(/-/g, '')}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    lines.push(`DTSTART:${f(start)}`, `DTEND:${f(end)}`);
  } else lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${addDays(e.date, 1).replace(/-/g, '')}`);
  const sr = seriesOf(e);
  if (sr?.repeat) lines.push(`RRULE:${sr.repeat === 'monthly' ? 'FREQ=MONTHLY' : `FREQ=WEEKLY;INTERVAL=${sr.repeat === 'biweekly' ? 2 : 1}`}`);
  lines.push(`SUMMARY:${escI(e.title)}`);
  if (e.location) lines.push(`LOCATION:${escI(e.location)}`);
  const desc = [e.personIds.length ? `With ${listNames(names(e.personIds))}` : '', e.note].filter(Boolean).join('\n');
  if (desc) lines.push(`DESCRIPTION:${escI(desc)}`);
  lines.push('BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', `DESCRIPTION:${escI(e.title)}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n');
}
async function shareFile(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (err) { if (err?.name === 'AbortError') return false; }
  download(name, text, type); return true;
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  search(v) { pf.q = v; render(); const q = $('#q'); q.focus(); q.setSelectionRange(v.length, v.length); },
  calShift(n) { calWeek = n === 0 ? weekStart(today()) : addDays(calWeek, n); render(); },
  rowSheet(pid, kind) {

  levelHint(k) { const el = $(`#${k === 'friend' ? 'f-tier' : 'f-interest'}-hint`); if (el) el.textContent = LEVELS[k][pickedLevel(k)].hint; },
  addSheet() {

  moreHistory(pid) { histAll = true; openModal(detailHtml(person(pid))); },

  /* people */
  personForm(id, kind) { gtagReset(id ? person(id).groups : []); openModal(personFormHtml(id ? person(id) : null, kind)); App.kindToggle(); },
  bulkForm() { gtagReset([]); openModal(bulkFormHtml()); App.kindToggle(); },
  gtagFocus() { gtag.open = true; gtag.active = 0; gtagRender(); },
  gtagBlur() { setTimeout(() => { if (document.activeElement?.id !== 'gtag-input') { gtag.open = false; gtagRender(); } }, 200); },
  gtagInput(v) {
    if (v.includes(',')) {   // a comma confirms what came before it
      const parts = v.split(',');
      for (const part of parts.slice(0, -1)) if (part.trim()) App.gtagAdd(part);
      v = parts.at(-1); const input = $('#gtag-input'); if (input) input.value = v;
    }
    gtag.q = v; gtag.open = true; gtag.active = 0; gtag.nav = false; gtagRender();
  },
  gtagHover(i) { if (gtag.active !== i) { gtag.active = i; gtagRender(); } },
  gtagAdd(name) {
    const g = canonGroup(name);
    if (g && !gtag.tags.some(t => t.toLowerCase() === g.toLowerCase())) gtag.tags.push(g);
  },
  gtagPick(i) {
    const o = gtag.opts[i]; if (!o) return;
    App.gtagAdd(o.g);
    gtag.q = ''; gtag.active = 0; gtag.open = true;
    const input = $('#gtag-input'); if (input) { input.value = ''; input.focus(); }
    gtagRender();
  },
  gtagRemove(i) { gtag.tags.splice(i, 1); gtagRender(); $('#gtag-input')?.focus(); },
  gtagKey(e) {
    const n = gtag.opts.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); gtag.open = true; gtag.nav = true; gtag.active = n ? (gtag.active + 1) % n : 0; gtagRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); gtag.nav = true; gtag.active = n ? (gtag.active - 1 + n) % n : 0; gtagRender(); }
    else if (e.key === 'Enter' || (e.key === 'Tab' && gtag.q.trim())) {
      if (e.key === 'Enter' || gtag.q.trim()) e.preventDefault();
      if (gtag.open && n && (gtag.q.trim() || gtag.nav)) { App.gtagPick(gtag.active); gtag.nav = false; }
      else if (gtag.q.trim()) { App.gtagAdd(gtag.q); gtag.q = ''; e.target.value = ''; gtagRender(); }
    }
    else if (e.key === 'Escape' && gtag.open) { e.preventDefault(); e.stopPropagation(); gtag.open = false; gtagRender(); }
    else if (e.key === 'Backspace' && !e.target.value && gtag.tags.length) { gtag.tags.pop(); gtagRender(); }
  },
  kindToggle() {
    const k = document.querySelector('input[name=f-kind]:checked')?.value;
    $('#f-tier-wrap').style.display = k === 'friend' ? '' : 'none';
    $('#f-int-wrap').style.display = k === 'acq' ? '' : 'none';
  },
  savePerson(id) {
    const name = $('#f-name').value.trim();
    if (!name) { $('#f-name').focus(); $('#f-name').style.borderColor = 'var(--overdue)'; return; }
    const kind = document.querySelector('input[name=f-kind]:checked').value;
    const bm = $('#f-bmonth').value, bd = Math.round(+$('#f-bday').value);
    const data = {
      name, kind,
      tier: pickedLevel('friend'), interest: pickedLevel('acq'),
      metAt: $('#f-metAt').value.trim(), metDate: $('#f-metDate').value || null,
      interests: $('#f-interests').value.trim(), notes: $('#f-notes').value.trim(),
      textEvery: +$('#f-textEvery').value || null, hangEvery: +$('#f-hangEvery').value || null,
      remote: $('#f-remote').checked, location: '',
      birthday: bm && bd >= 1 && bd <= 31 ? `${bm}-${pad(bd)}` : null,
      groups: gtagValue(),
    };
    if (id) {
      const p = person(id);
      if (p.kind === 'acq' && kind === 'friend' && !p.promotedAt) p.promotedAt = today();
      if (kind === 'acq') p.promotedAt = null;
      Object.assign(p, data);
    } else {
      state.people.push(newPerson(data));
    }
    save(); closeModal(); render();
    toast(id ? `Saved ${esc(name)}` : `Added ${esc(name)}`);
    if (id) App.detail(id);
  },
  saveBulk() {
    const list = [...new Set($('#b-names').value.split('\n').map(x => x.trim()).filter(Boolean))];
    if (!list.length) { $('#b-names').focus(); return; }
    const kind = document.querySelector('input[name=f-kind]:checked').value;
    const base = {
      kind, tier: pickedLevel('friend'), interest: pickedLevel('acq'), remote: $('#b-remote').checked, location: '',
      groups: gtagValue(), metAt: '', metDate: null, interests: '', notes: '', textEvery: null, hangEvery: null, birthday: null,
    };
    const added = list.map(name => newPerson({ ...base, name, groups: [...base.groups] }));
    state.people.push(...added);
    save(); closeModal(); render();

  detail(id) { histAll = false; if (person(id)) openModal(detailHtml(person(id))); },

  /* logging */
  logForm(pid, type) {
    if (!pid && !activePeople().length) { App.personForm(); return; }
    comboReset('single', pid ? [pid] : []);
    openModal(logFormHtml(pid, type)); App.typeToggle();
  },
  typeToggle() {
    const t = document.querySelector('input[name=l-type]:checked')?.value;
    $('#l-hours-wrap').style.display = t === 'hangout' ? '' : 'none';
  },
  saveLog() {
    const pid = combo.ids[0];
    if (!pid || !person(pid)) { $('#combo-box').classList.add('invalid'); $('#combo-input').focus(); return; }
    const type = document.querySelector('input[name=l-type]:checked').value;
    const by = $('#l-them').checked ? 'them' : 'me';
    const p = person(pid), before = stats(p).hours;
    const hours = +(document.querySelector('input[name=l-hours]:checked')?.value || 2);
    const l = addLog(pid, type, $('#l-date').value || today(), hours, $('#l-note').value, null, by);

    save(); closeModal(); render();
    milestoneToast(p, before, () => toast(type === 'hangout' ? `Logged time with ${esc(p.name)}` : `Logged ${type} with ${esc(p.name)}`, () => App.undoLog(l.id)));
  },
  quickLog(pid, type, fromDetail, by = 'me') {
    const l = addLog(pid, type, today(), 0, '', null, by);
    save(); render();
    if (fromDetail) App.detail(pid);
    const p = person(pid);
    toast(by === 'them' ? `Noted that ${esc(p.name)} reached out` : type === 'call' ? `Logged a call with ${esc(p.name)}` : `Checked in with ${esc(p.name)}`, () => { App.undoLog(l.id); if (fromDetail) App.detail(pid); });
  },
  undoLog(lid) { state.logs = state.logs.filter(l => l.id !== lid); save(); render(); },
  delLog(lid, pid) {
    const l = state.logs.find(x => x.id === lid);
    state.logs = state.logs.filter(x => x.id !== lid);
    if (l?.eventId) { const e = getEvent(l.eventId); if (e) e.personIds = e.personIds.filter(x => x !== pid); }

  skip(pid, type) {
    const p = person(pid); p.skip = p.skip || {};
    const prev = p.skip[type];
    p.skip[type] = weekStart(today()); save(); render();

  },

  /* follow-ups */
  fuAdd(pid) {
    const text = $('#fu-text').value.trim();
    if (!text) { $('#fu-text').focus(); return; }
    person(pid).followUps.push({ id: uid(), text, date: $('#fu-date').value || null, done: false, created: today() });
    save(); render(); App.detail(pid);
    $('#fu-text')?.focus();
  },
  fuDone(pid, fid, fromDetail) {
    const f = person(pid).followUps.find(x => x.id === fid); f.done = true; f.doneAt = today();
    save(); render(); if (fromDetail) App.detail(pid);
    toast('Follow-up done', () => { f.done = false; save(); render(); if (fromDetail) App.detail(pid); });
