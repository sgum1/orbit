  fuDel(pid, fid) { const p = person(pid); p.followUps = p.followUps.filter(x => x.id !== fid); save(); render(); App.detail(pid); },

  /* events */
  eventForm(id, preset = {}) {
    const e = id ? JSON.parse(JSON.stringify(getEvent(id))) : { title: preset.title || '', date: preset.date || today(), time: '', hours: 2, personIds: preset.personIds || [], location: '', note: '', done: false };
    comboReset('multi', e.personIds);
    openModal(eventFormHtml(e));
  },
  planGroup(i) { const [g, ids] = groupSugs[i] || []; if (g) App.eventForm(null, { personIds: ids, title: g }); },
  pickGroup(i) {
    const g = allGroups()[i];
    const members = activePeople().filter(p => (p.groups || []).includes(g)).map(p => p.id);
    const allIn = members.every(id => combo.ids.includes(id));
    combo.ids = allIn ? combo.ids.filter(id => !members.includes(id)) : [...new Set([...combo.ids, ...members])];
    comboRender();
  },

  /* person picker */
  comboFocus() { combo.open = true; combo.active = 0; comboRender(); },
  comboBlur() { setTimeout(() => { if (document.activeElement?.id !== 'combo-input') { combo.open = false; comboRender(); } }, 200); },
  comboInput(v) { combo.q = v; combo.open = true; combo.active = 0; combo.nav = false; $('#combo-box')?.classList.remove('invalid'); comboRender(); },
  comboHover(i) { if (combo.active !== i) { combo.active = i; comboRender(); } },
  comboPick(id) {
    combo.ids = combo.mode === 'single' ? [id] : [...new Set([...combo.ids, id])];
    combo.q = ''; combo.active = 0;
    const input = $('#combo-input');
    if (input) input.value = '';
    $('#combo-box')?.classList.remove('invalid');
    if (combo.mode === 'single') { combo.open = false; comboRender(); }
    else { combo.open = true; comboRender(); input?.focus(); }
  },
  comboRemove(id) {
    combo.ids = combo.ids.filter(x => x !== id);
    comboRender();
    const input = $('#combo-input'); if (input) { input.value = ''; combo.q = ''; input.focus(); }
  },
  comboKey(e) {
    const n = combo.matches.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); combo.open = true; combo.nav = true; combo.active = n ? (combo.active + 1) % n : 0; comboRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); combo.nav = true; combo.active = n ? (combo.active - 1 + n) % n : 0; comboRender(); }
    else if (e.key === 'Enter' || (e.key === 'Tab' && combo.q.trim() && n)) {
      if (combo.open && n && (combo.q.trim() || combo.nav)) { e.preventDefault(); combo.nav = false; App.comboPick(combo.matches[combo.active].p.id); }
      else if (e.key === 'Enter') e.preventDefault();
    }
    else if (e.key === 'Escape' && combo.open) { e.preventDefault(); e.stopPropagation(); combo.open = false; comboRender(); }
    else if (e.key === 'Backspace' && !e.target.value && combo.ids.length && combo.mode === 'multi') { combo.ids = combo.ids.slice(0, -1); comboRender(); }
  },
  evDateChange() {
    const d = $('#e-date').value;
    $('#e-done-wrap').style.display = d && d <= today() ? '' : 'none';
    if (d && d < today()) $('#e-done').checked = true;
  },
  saveEvent(id) {
    const date = $('#e-date').value;
    if (!date) { $('#e-date').style.borderColor = 'var(--overdue)'; return; }
    const personIds = combo.ids.filter(id => person(id));
    let title = $('#e-title').value.trim();
    if (!title) title = personIds.length ? `Time with ${listNames(names(personIds))}` : 'Social activity';
    const repeat = $('#e-repeat').value;
    const data = { title, date, time: $('#e-time').value || '', hours: Math.max(0, +$('#e-hours').value || 0), personIds, location: $('#e-location').value.trim(), note: $('#e-note').value.trim(), done: date <= today() && $('#e-done').checked };
    let e;
    const startSeries = ev => { const sid = uid(); ev.seriesId = sid; state.series[sid] = { repeat, lastGen: ev.date, day: parseD(ev.date).getDate(), tpl: tplOf(ev) }; };
    const dropFuture = ev => { state.events = state.events.filter(o => !(o.seriesId === ev.seriesId && o.id !== ev.id && !o.done && o.date > ev.date)); };
    if (id) {
      e = getEvent(id); Object.assign(e, data);
      const sr = seriesOf(e);
      if (sr && sr.repeat) {
        if (!repeat) { dropFuture(e); sr.repeat = ''; }
        else if (repeat !== sr.repeat) { dropFuture(e); sr.repeat = ''; delete e.seriesId; startSeries(e); }
        else {
          sr.tpl = tplOf(e);
          for (const o of state.events) if (o.seriesId === e.seriesId && o.id !== e.id && !o.done && o.date > e.date) { Object.assign(o, tplOf(e)); syncEventLogs(o); }
        }
      } else if (repeat) startSeries(e);
    } else {
      e = { id: uid(), ...data }; state.events.push(e);
      if (repeat) startSeries(e);
    }
    syncEventLogs(e);
    materialize(addDays(today(), 42));
    save(); closeModal(); render();
    if (e.done) toast(`Logged ${esc(e.title)}`);
    else toast(`Added ${esc(e.title)} on ${wd(e.date)}`, () => App.ics(e.id), 'Add to calendar app');
  },
  confirmEvent(id) {
    const e = getEvent(id); e.done = true; syncEventLogs(e); save(); render();
    toast(`Logged ${esc(e.title)}`, () => { e.done = false; syncEventLogs(e); save(); render(); });
  },
  cancelEvent(id) {
    const e = getEvent(id); state.events = state.events.filter(x => x.id !== id); save(); render();
    toast(`Removed ${esc(e.title)}`, () => { state.events.push(e); save(); render(); });
  },
  deleteEvent(id, all) {
    const e = getEvent(id);
    if (e.done && !confirm('Delete this activity? The time together it logged will be removed too.')) return;
    const sr = seriesOf(e);
    const gone = new Set([id]);
    if (all && sr) { for (const o of state.events) if (o.seriesId === e.seriesId && !o.done && o.date >= e.date) gone.add(o.id); sr.repeat = ''; }
    state.events = state.events.filter(x => !gone.has(x.id));
    state.logs = state.logs.filter(l => !gone.has(l.eventId));
    save(); closeModal(); render(); toast(all ? `Deleted upcoming ${esc(e.title)}` : `Deleted ${esc(e.title)}`);
  },
  ics(id) { const e = getEvent(id); if (e) download(`${e.title.replace(/[^\w\- ]+/g, '').trim() || 'plan'}.ics`, icsText(e), 'text/calendar'); },

  /* tiers */
  promoteForm(pid) {
    const p = person(pid);
    openModal(`<h2>Promote ${esc(p.name)}</h2>
      <p class="sub">They'll keep a "grew from acquaintance" tag so you remember where it started.</p>
      <div class="field"><label>Friend tier</label><select id="pr-tier">${Object.entries(LEVELS.friend).map(([l, L]) => `<option value="${l}" ${+l === 4 ? 'selected' : ''}>${L.label}: ${esc(L.hint)}</option>`).join('')}</select>
      <span class="hint">Most new friendships start as casual or good friends.</span></div>
      <div class="foot"><button class="btn btn-quiet" onclick="App.detail('${pid}')">Back</button><button class="btn btn-primary" onclick="App.promote('${pid}')">Promote</button></div>`);
  },
  promote(pid) {
    const p = person(pid);
    p.kind = 'friend'; p.tier = +$('#pr-tier').value; p.promotedAt = today();
    save(); render(); App.detail(pid);
    toast(`${esc(p.name)} is now a friend`);
  },
  applyTier(pid, action, to) {
    const p = person(pid);
    if (action === 'archive') { App.archive(pid); return; }
    const prev = p.tier; p.tier = to; save(); render();
    toast(`${esc(p.name)} is now a ${LEVELS.friend[to].label.toLowerCase()}`, () => { p.tier = prev; save(); render(); });
  },
  dismissTier(pid) { state.settings.tierDismiss[pid] = today(); save(); render(); },
  archive(pid) {
    const p = person(pid); p.archived = !p.archived; save(); closeModal(); render();
    toast(p.archived ? `Archived ${esc(p.name)}` : `Unarchived ${esc(p.name)}`, () => { p.archived = !p.archived; save(); render(); });
  },
  delPerson(pid) {
    const p = person(pid);
    if (!confirm(`Delete ${p.name} and all their history? This can't be undone. Archiving hides them instead.`)) return;
    state.people = state.people.filter(x => x.id !== pid);
    state.logs = state.logs.filter(l => l.personId !== pid);
    for (const e of state.events) e.personIds = e.personIds.filter(x => x !== pid);
    for (const sr of Object.values(state.series)) sr.tpl.personIds = sr.tpl.personIds.filter(x => x !== pid);
    save(); closeModal(); render(); toast(`Deleted ${esc(p.name)}`);
  },

  /* settings & data */
  setIv(k, l, t, v) { state.settings.intervals[k][l][t] = Math.max(1, Math.round(+v || 1)); save(); renderNav(); },
  resetIv() { state.settings.intervals = defaultIntervals(); save(); render(); toast('Cadences reset to defaults'); },
  setCap(t, v) { state.settings.weekCaps[t] = Math.max(1, Math.round(+v || 1)); save(); renderNav(); },
  snoozeBackup() { state.settings.backupSnooze = today(); save(); render(); },
  async exportData() {
    const okd = await shareFile(`orbit-backup-${today()}.json`, JSON.stringify(state, null, 2), 'application/json');
    if (!okd) return;
    state.settings.lastBackup = today(); save(); render();
    toast('Backup saved. Keep it somewhere safe, like iCloud Drive.');
  },
  async checkUpdate() {
    toast('Checking for updates…');
    try {
      const res = await fetch(`sw.js?t=${Date.now()}`, { cache: 'no-store' });
      const live = ((await res.text()).match(/orbit-v(\d+)/) || [])[1];
      if (!live) throw 0;
      if (+live > +APP_VERSION) {
        toast(`Updating to version ${live}…`);
        const reg = await navigator.serviceWorker?.getRegistration();
        await reg?.update().catch(() => {});
        if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
        setTimeout(() => location.reload(), 400);
      } else toast(`You're up to date. Version ${APP_VERSION} is the newest one online.`);
    } catch { toast(`Couldn't check right now. Try again when you're online.`); }
  },
  async syncAuth(create) {
    const email = $('#s-email').value.trim(), pw = $('#s-pass').value;
    if (!email || !pw) { toast('Enter your email and a password.'); return; }
    const { A, auth } = Sync.fb;
    Sync.error = '';
    try {
      if (create) await A.createUserWithEmailAndPassword(auth, email, pw);
      else await A.signInWithEmailAndPassword(auth, email, pw);
      toast(create ? 'Account created. Syncing this device…' : 'Signed in. Syncing this device…');
    } catch (e) { Sync.error = Sync.friendly(e); render(); }
  },
  async syncReset() {
    const email = $('#s-email').value.trim();
    if (!email) { toast('Type your email first, then tap Forgot password.'); return; }
    try { await Sync.fb.A.sendPasswordResetEmail(Sync.fb.auth, email); toast('Password reset email sent.'); }
    catch (e) { Sync.error = Sync.friendly(e); render(); }
  },
  async syncSignOut() {
    if (!confirm('Sign out on this device? Your data stays here, but it stops syncing until you sign in again.')) return;
    Sync.stop();
    await Sync.fb.A.signOut(Sync.fb.auth).catch(() => {});
    toast('Signed out. This device keeps its copy.');
  },
  dismissInstall() { state.settings.installDismissed = true; save(); render(); },
  async install() { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice.catch(() => {}); installPrompt = null; render(); },
  importData(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.people) || !Array.isArray(d.logs)) throw 0;
        if (!confirm(`Replace your current data with this backup (${d.people.length} people, ${d.logs.length} interactions)?${Sync.user ? ' This also replaces the data synced to your account.' : ''}`)) return;
        localStorage.setItem(KEY, JSON.stringify(d)); state = load(); save(); render(); toast('Backup imported');
      } catch { alert(`That file doesn't look like an Orbit backup.`); }
    };
    r.readAsText(file);
  },
  wipe() { if (confirm(`Erase all people, plans and history? ${Sync.user ? 'This also erases it from your account and every signed-in device. ' : ''}Export a backup first if you might want it.`)) { state = freshState(); save(); render(); } },
  removeSample() {
    const ids = new Set(state.people.filter(isSample).map(p => p.id));
    if (!ids.size) return;
    const onlySample = list => list.length > 0 && list.every(id => ids.has(id));
    const goneEvents = new Set(state.events.filter(e => e.sample || onlySample(e.personIds)).map(e => e.id));
    state.people = state.people.filter(p => !ids.has(p.id));
    state.logs = state.logs.filter(l => !ids.has(l.personId) && !goneEvents.has(l.eventId));
    state.events = state.events.filter(e => !goneEvents.has(e.id));
    for (const e of state.events) e.personIds = e.personIds.filter(id => !ids.has(id));
    for (const [sid, sr] of Object.entries(state.series)) {
      if (onlySample(sr.tpl.personIds)) delete state.series[sid];
      else sr.tpl.personIds = sr.tpl.personIds.filter(id => !ids.has(id));
    }
    for (const id of ids) delete state.settings.tierDismiss[id];
    pf = { q: '', kind: 'all', sort: 'urgency', group: '' };
    save(); closeModal(); render();
    toast(state.people.length ? 'Sample data removed. Your own people are untouched.' : 'Sample data removed. Add your first person with the + button.');
  },
  loadSample() {
    if (state.people.length && !confirm('Add sample people alongside your existing data?')) return;
    const t = today(), d = n => addDays(t, -n);
    const ids = {};
    const mk = (key, name, kind, lv, extra, logs) => {
      const p = newPerson({ sample: true, name, kind, tier: kind === 'friend' ? lv : 3, interest: kind === 'acq' ? lv : 1, created: d(120), metAt: '', metDate: null, interests: '', notes: '', textEvery: null, hangEvery: null, birthday: null, ...extra });
      state.people.push(p); ids[key] = p.id;
      for (const [type, n, hours, note, by] of logs) state.logs.push({ id: uid(), personId: p.id, type, date: d(n), hours: hours || 0, note: note || '', by: by || 'me', ts: Date.now() - n });
      return p;
    };
    const soonBday = addDays(t, 3).slice(5);
    const jordan = mk('jordan', 'Jordan (sample)', 'friend', 1, { interests: 'basketball, cooking', notes: 'Roommate from sophomore year', groups: ['College'] }, [['text', 4, 0, '', 'them'], ['hangout', 12, 3, 'Talked about their job search']]);
    jordan.followUps.push({ id: uid(), text: 'Ask how the final-round interview went', date: addDays(t, 1), done: false, created: d(12) });
    mk('priya', 'Priya (sample)', 'friend', 2, { interests: 'F1, travel', birthday: soonBday }, [['text', 2], ['hangout', 16, 2.5]]);
    mk('marcus', 'Marcus (sample)', 'friend', 3, { interests: 'running, film', groups: ['College'] }, [['text', 20], ['hangout', 70, 4, 'Training for a half marathon']]);
    mk('taylor', 'Taylor (sample)', 'friend', 4, { groups: ['College'] }, [['text', 40], ['text', 75], ['text', 110], ['text', 140], ['text', 170], ['hangout', 150, 2]]);
    mk('alex', 'Alex (sample)', 'friend', 2, { remote: true, interests: 'NBA, new job' }, [['text', 9], ['call', 24, 0, '', 'them'], ['hangout', 200, 20, 'Visited over the summer']]);
    mk('sam', 'Sam (sample)', 'acq', 1, { metAt: 'Climbing gym', metDate: d(35), interests: 'bouldering, indie music', groups: ['Climbing'] }, [['hangout', 35, 1.5, 'Wants to try the outdoor spot'], ['text', 30], ['hangout', 21, 3], ['hangout', 13, 2.5], ['text', 9, 0, '', 'them']]);
    mk('riley', 'Riley (sample)', 'acq', 2, { metAt: `Priya's birthday`, metDate: d(25), interests: 'board games' }, [['hangout', 25, 3, 'Mentioned a game night']]);
    mk('chris', 'Chris (sample)', 'friend', 3, { metAt: 'Work', promotedAt: d(10) }, [['hangout', 80, 10], ['hangout', 60, 15], ['hangout', 40, 12], ['hangout', 25, 8], ['hangout', 11, 6], ['text', 3]]);
    const climb = { id: uid(), sample: true, title: 'Climbing', date: addDays(t, 2), time: '18:30', hours: 2, personIds: [ids.sam], location: 'Bouldering gym', note: '', done: false };
    const sid = uid(); climb.seriesId = sid;
    state.series[sid] = { sample: true, repeat: 'weekly', lastGen: climb.date, day: parseD(climb.date).getDate(), tpl: tplOf(climb) };
    state.events.push(climb);
    state.events.push({ id: uid(), sample: true, title: 'Game night', date: addDays(t, 4), time: '19:00', hours: 3, personIds: [ids.riley, ids.priya], location: '', note: '', done: false });
    save(); render(); toast('Sample data loaded');
  },
};

// keep dates fresh if the page stays open overnight or in a background tab
let renderedDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderedDay = today(); render(); } });
setInterval(() => { if (today() !== renderedDay) { renderedDay = today(); render(); } }, 60000);
try { navigator.storage?.persist?.(); } catch {}
Sync.boot();
window.addEventListener('online', () => { if (!Sync.fb) Sync.boot(); else if (Sync.user && Sync.status === 'offline') { Sync.status = 'synced'; Sync.refresh(); } });
window.addEventListener('offline', () => { if (Sync.user) { Sync.status = 'offline'; Sync.refresh(); } });
// Offline support. Checks for a newer version on launch and whenever the app comes back to the foreground,
// and reloads once when one is installed, so you're never stuck on an old copy.
if (isHosted() && 'serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || $('#modal-root').innerHTML) return;   // don't interrupt an open form
    reloaded = true; location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; render(); });

render();
</script>
